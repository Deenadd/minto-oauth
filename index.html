<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing in to Minto</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafaf8; color: #151515;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { text-align: center; padding: 24px; }
  a { color: inherit; font-weight: 600; }
  p { color: #727270; }
</style>
</head>
<body>
<main>
  <h1>Almost there.</h1>
  <p id="msg">Opening Minto…</p>
  <p><a id="open" href="#">Open Minto</a> if nothing happens, then close this tab.</p>
</main>
<script>
  // Slack sends ?code=…&state=… (or ?error=…) here. Hand it straight to the app.
  var target = "minto://oauth" + window.location.search;
  document.getElementById("open").href = target;
  if (window.location.search) { window.location.replace(target); }
  else { document.getElementById("msg").textContent = "This page only works as the end of a Slack sign-in."; }
</script>
</body>
</html>
